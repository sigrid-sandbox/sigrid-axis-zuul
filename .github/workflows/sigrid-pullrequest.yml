name: sigrid-pullrequest

on: [pull_request]

jobs:
  sigridci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download Sigrid CI
        run: git clone https://github.com/Software-Improvement-Group/sigridci.git sigridci
      - name: Run Sigrid CI
        env:
          SIGRID_CI_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}
          SIGRIDCI_GITHUB_COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./sigridci/sigridci/sigridci.py --customer sigridsandbox --system autofix-zuul --source .
