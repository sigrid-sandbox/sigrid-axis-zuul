name: sigrid-drift-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  drift-review:
    # Not for drafts: the review starts once the pull request is marked ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write
    env:
      SIGRID_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check Sigrid system
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $SIGRID_TOKEN" -H "Accept: application/json" \
            "https://sigrid-says.com/rest/analysis-results/api/v1/system-metadata/sigridsandbox/autofix-zuul")
          [ "$code" = 200 ] || { echo "Sigrid system check failed (HTTP $code)" >&2; exit 1; }
      - name: Install Copilot CLI and connect Axis
        run: |
          npm install -g @github/copilot
          copilot mcp add --transport http --header "Authorization: Bearer $SIGRID_TOKEN" axis https://sigrid-says.com/mcp
          copilot plugin marketplace add Software-Improvement-Group/agent-integrations
          copilot plugin install axis@sigrid
      - name: Review architecture drift
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          copilot -p "Review pull request $PR for architecture drift using the architecture-drift skill in autonomous mode. Sigrid customer and system are in .sigrid/profile.md. Scope the diff to exactly this pull request: use 'git diff $BASE HEAD', not local uncommitted changes. After the skill finishes, post exactly one comment with 'gh pr comment $PR --body ...': if drift was found, its findings (what changed, why it is drift, which files to touch instead); otherwise a short comment stating that no architecture drift was found. If the skill cannot complete, post one comment explaining what blocked it. Never modify files, never open or merge pull requests, and never retry a failed tool call with different arguments. If 'gh pr comment' fails, stop and exit with an error." \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(gh pr comment:*)' \
            --allow-tool 'read' \
            --allow-tool 'axis' \
            --log-dir copilot-logs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: copilot-logs
          path: copilot-logs
          retention-days: 30
