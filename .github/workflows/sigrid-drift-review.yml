name: sigrid-drift-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  drift-review:
    # Not for drafts: the review starts once the pull request is marked ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write
    env:
      SIGRID_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      COMMENT_FILE: drift-comment.md
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Copilot CLI, Axis MCP server and skills
        run: |
          npm install -g @github/copilot
          copilot mcp add --transport http --header "Authorization: Bearer $SIGRID_TOKEN" axis https://sigrid-says.com/mcp
          npx --yes skills add Software-Improvement-Group/agent-integrations --skill '*' -a github-copilot -y
      - name: Review architecture drift
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          copilot -p "Review pull request $PR for architecture drift using the architecture-drift skill in autonomous mode. Sigrid customer and system are in .sigrid/profile.md. Scope the diff to exactly this pull request: use 'git diff $BASE HEAD', not local uncommitted changes. When you are done, write one markdown comment to $COMMENT_FILE. Its first line is exactly DRIFT: found, DRIFT: none or DRIFT: blocked (the check could not complete). The following lines are the comment: if drift was found, its findings (what changed, why it is drift, which files to touch instead); otherwise a short note stating that no architecture drift was found. If the check cannot complete, write a comment explaining what blocked it. Do not post the comment yourself. Never modify any other file, never open or merge pull requests, and never retry a failed tool call with different arguments." \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'read' \
            --allow-tool 'write' \
            --allow-tool 'axis' \
            --log-dir copilot-logs
      # The comment is posted as the sigrid-architecture-drift app, not as github-actions.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DRIFT_APP_ID }}
          private-key: ${{ secrets.DRIFT_APP_PRIVATE_KEY }}
      - name: Post comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tail -n +2 "$COMMENT_FILE" | gh pr comment "$PR" --body-file -
      # Fails the check unless no drift was found, so the autofix review can wait for this result.
      - name: Fail on drift
        run: |
          result=$(head -n 1 "$COMMENT_FILE")
          [ "$result" = "DRIFT: none" ] || { echo "Architecture drift check result: $result"; exit 1; }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: copilot-logs
          path: copilot-logs
          retention-days: 30
