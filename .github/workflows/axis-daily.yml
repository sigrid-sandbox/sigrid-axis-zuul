name: axis-daily

# Each run diagnoses one area with the Copilot CLI, lets it commit the top fix on a branch, then
# pushes the branch and opens a pull request. The push and the pull request use a token of the
# axis-autofix GitHub App, because events created with GITHUB_TOKEN do not start the PR Build,
# Sigrid, drift review or autofix review workflows.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: maintainability
            task: >-
              Run the diagnose skill for maintainability on this repository (Sigrid customer and
              system are in .sigrid/profile.md). Any part of the codebase may be picked. If it finds
              nothing worth fixing, say so and stop without changing anything.
              Otherwise run the autofix skill on its plan.
          - area: architecture
            task: >-
              Run the diagnose skill for architecture on this repository (Sigrid customer and system
              are in .sigrid/profile.md). If it finds nothing worth fixing, say so and
              stop without changing anything. Otherwise run the autofix skill for architecture on
              its plan, then run the change-feedback skill for architecture on the result and state
              its verdict in the commit message body.
          - area: osh-security
            task: >-
              First read the Sigrid objectives of this system from the file $OBJECTIVES (the Sigrid
              objectives-evaluation API result for today) and look at the entry whose systemName is
              "autofix-zuul". Only the open source health and security objectives count. If all of
              them are met, say so and stop without changing anything. Otherwise run
              the autofix skill for open-source and/or security, whichever has an unmet objective.
    env:
      SIGRID_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      AREA: ${{ matrix.area }}
    steps:
      - name: Create axis-autofix app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AXIS_APP_ID }}
          private-key: ${{ secrets.AXIS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Copilot CLI, Axis MCP server and skills
        run: |
          npm install -g @github/copilot
          copilot mcp add --transport http --header "Authorization: Bearer $SIGRID_TOKEN" axis https://sigrid-says.com/mcp
          npx --yes skills add Software-Improvement-Group/agent-integrations --skill '*' -a github-copilot -y
      - name: Create fix branch
        run: |
          git config user.name "axis-autofix[bot]"
          git config user.email "${{ vars.AXIS_APP_ID }}+axis-autofix[bot]@users.noreply.github.com"
          branch="axis-autofix/$AREA-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "OBJECTIVES=$RUNNER_TEMP/objectives.json" >> "$GITHUB_ENV"
          git switch -c "$branch"
      # Fetched here, not by the agent: the CLI asks for approval on URLs in shell commands.
      - name: Fetch Sigrid objectives
        if: matrix.area == 'osh-security'
        run: |
          today=$(date +%F)
          curl --fail --silent --show-error -H "Authorization: Bearer $SIGRID_TOKEN" \
            "https://sigrid-says.com/rest/analysis-results/api/v1/objectives-evaluation/sigridsandbox?startDate=$today&endDate=$today" \
            -o "$OBJECTIVES"
      - name: Diagnose and fix
        env:
          TASK: ${{ matrix.task }}
        run: |
          copilot -p "$TASK The objectives file, if the task mentions one, is $OBJECTIVES. Follow AGENTS.md. Commit the fix locally on the current branch; do not push, do not open a pull request and do not change files under .github/. Make the commit message say which finding was fixed and what changed. Never retry a failed tool call with different arguments." \
            --add-dir "$RUNNER_TEMP" \
            --allow-tool 'write' \
            --allow-tool 'read' \
            --allow-tool 'shell(git add:*)' \
            --allow-tool 'shell(git commit:*)' \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(git status:*)' \
            --allow-tool 'axis' \
            --log-dir copilot-logs
      - name: Push branch and open pull request
        env:
          # An app token, so the pull request starts the PR Build, Sigrid and review workflows.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$(git rev-list --count "origin/${{ github.event.repository.default_branch }}..HEAD")" = 0 ]; then
            echo "No commits, nothing to open."
            exit 0
          fi
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
            --fill
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: copilot-logs-${{ matrix.area }}
          path: copilot-logs
          retention-days: 30
